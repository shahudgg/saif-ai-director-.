name: Embedded engine host compatibility
on:
  push:
    branches: ["arena/**"]
    paths:
      - '.github/workflows/engine-host-compatibility.yml'
      - 'engine-integration/**'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/antigem/agy_ide_bridge/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Compile host with embedded engine experiment
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug -PembeddedEngine --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Check bundled engine assets
        run: |
          python3 - <<'PYCODE'
          import zipfile
          p = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              required = [
                  'assets/bin/agy_ide_bridge', 'assets/bin/backup_bootstrap',
                  'assets/bin/backup_chats', 'assets/bin/restore_chats',
                  'assets/browser-extensions/google-flow/manifest.json',
                  'assets/extension-docs/README.md', 'assets/licenses/ANTIGEM_GPL-3.0.txt'
              ]
              missing = [n for n in required if n not in names]
              if missing: raise SystemExit('Missing bundled assets: ' + ', '.join(missing))
              elf = z.read('assets/bin/agy_ide_bridge')[:20]
              if elf[:4] != b'\x7fELF' or int.from_bytes(elf[18:20], 'little') != 183:
                  raise SystemExit('Bridge is not an arm64 ELF')
              print('Required engine assets and arm64 bridge verified in APK')
          PYCODE
      - name: Report errors
        if: failure()
        run: |
          python3 -c 'import os; p=os.environ["RUNNER_TEMP"]+"/build.log"; t=open(p).read() if os.path.isfile(p) else "No build log"; t="\n".join([line for line in t.splitlines() if any(w in line.lower() for w in ("error", "caused by", "exception", "dex", "failed", "outofmemory"))])[-12000:]; print("::error::"+t.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
