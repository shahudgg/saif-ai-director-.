name: Verify uploaded AntiGem source
on:
  push:
    branches: ["arena/**"]
    paths:
      - '.github/workflows/antigem-reference-build.yml'
      - 'vendor/antigem/**'
permissions:
  contents: read
jobs:
  reference-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/antigem/agy_ide_bridge/go.mod
      - name: Build original Termux variant debug app
        working-directory: vendor/antigem
        shell: bash
        run: |
          set -o pipefail
          bash gradlew :app:assembleTermuxDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/antigem-build.log"
      - name: Summarize errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/antigem-build.log" ]; then
            tail -80 "$RUNNER_TEMP/antigem-build.log" >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed|^> Could not|^BUILD FAILED)' "$RUNNER_TEMP/antigem-build.log" | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: antigem-reference-debug
          path: vendor/antigem/app/build/outputs/apk/termux/debug/*.apk
          if-no-files-found: error
          retention-days: 3
