name: Embedded engine compile check
on:
  push:
    branches: ["arena/**"]
    paths:
      - 'engine-integration/**'
      - '.github/workflows/engine-integration-check.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile source as Android library
        shell: bash
        run: |
          set -o pipefail
          bash vendor/antigem/gradlew -p engine-integration assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report errors
        if: failure()
        run: |
          python3 -c 'import os; t=open(os.environ["RUNNER_TEMP"]+"/build.log").read(); i=t.find("* What went wrong:"); t=t[i:i+9000] if i>=0 else t[-9000:]; print("::error::"+t.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))' 
