name: CI Diagnostics (compile errors)

# TEMPORARY diagnostic workflow: captures the Kotlin compiler output and pushes it
# to the `ci-errors` branch so the full error list can be inspected without the
# Actions log viewer. Safe to delete once the build is green.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Compile (capture everything)
      id: compile
      shell: bash
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        set +e
        gradle assembleDebug --no-daemon > /tmp/build.log 2>&1
        echo "exit=$?" >> /tmp/build.log

    - name: Extract errors
      shell: bash
      run: |
        mkdir -p ci-logs
        {
          echo "#### KOTLIN / GRADLE ERRORS ####"
          grep -nE "^(e:|w:) " /tmp/build.log || echo "(no e:/w: lines)"
          echo
          echo "#### FAILED TASKS / SUMMARY ####"
          grep -nE "^> Task .*FAILED|^FAILURE:|Execution failed for task|What went wrong|^Caused by:|^\* Try:|BUILD FAILED" /tmp/build.log || true
          echo
          echo "#### LAST 200 LINES OF LOG ####"
          tail -200 /tmp/build.log
        } > ci-logs/compile-errors.txt
        echo "--- byte size: $(wc -c < ci-logs/compile-errors.txt)"
        echo "--- error line count: $(grep -cE '^e: ' /tmp/build.log || true)"
        head -c 60000 ci-logs/compile-errors.txt || true

    - name: Publish as annotations (fallback)
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import os, subprocess
        p = "ci-logs/compile-errors.txt"
        if not os.path.exists(p):
            print("::error::ci-logs/compile-errors.txt missing")
            raise SystemExit(0)
        text = open(p, encoding="utf-8", errors="replace").read()
        # 10 annotations max per step; chunk the text and escape workflow-command chars.
        n, size = 10, max(1, (len(text) + 9) // 10)
        for i in range(n):
            chunk = text[i*size:(i+1)*size]
            if not chunk:
                continue
            esc = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            print(f"::error::PART {i+1}/{n} {esc}")
        PY

    - name: Push error log to ci-errors branch
      if: always()
      shell: bash
      run: |
        set -e
        git config user.name  "ci-diagnostics"
        git config user.email "ci-diagnostics@users.noreply.github.com"
        git checkout -B ci-errors
        git add -f ci-logs/compile-errors.txt
        git commit -m "ci: kotlin compile errors $(date -u +%FT%TZ)" || echo "nothing to commit"
        git push -f origin ci-errors
        echo "pushed to ci-errors"
