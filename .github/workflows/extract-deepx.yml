name: Extract DeepX studio source

# The DeepX zip lives in Git LFS (461 MB). The development sandbox cannot reach the LFS object
# hosts, so a GitHub runner (full network + LFS) extracts the source here and pushes it back as
# plain files on the `deepx-extracted` branch. Every stage is logged, and the log is also posted
# to a GitHub issue, because workflow-run logs are not readable from the sandbox.
on:
  push:
    paths:
      - '.github/workflows/extract-deepx.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main (the zip lives there)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Extract (never aborts; everything is logged)
        run: |
          set +e
          mkdir -p deepx_meta
          LOG=deepx_meta/status.txt
          : > $LOG
          say() { echo "$@" | tee -a $LOG; }
          say "== runner $(date -u) =="
          say "-- pointer file:"; ls -l "deepx video generator studio.zip" >> $LOG 2>&1
          say "-- git lfs version:"; git lfs version >> $LOG 2>&1
          say "-- git lfs pull:"
          git lfs pull --include="deepx video generator studio.zip" >> $LOG 2>&1
          say "lfs_pull_exit=$?"
          ls -l "deepx video generator studio.zip" >> $LOG 2>&1
          head -c 120 "deepx video generator studio.zip" | strings >> $LOG 2>&1

          python3 - >> $LOG 2>&1 <<'PY'
          import zipfile, os, json, shutil, traceback
          src = "deepx video generator studio.zip"
          out = "deepx_src"
          CODE = {".ts",".tsx",".js",".jsx",".mjs",".cjs",".css",".scss",".sass",".less",
                  ".html",".htm",".json",".md",".txt",".yml",".yaml",".py",".vue",".svelte",
                  ".toml",".gradle",".kt",".java",".xml",".properties",".sql",".env",".example",
                  ".sh",".gitignore",".lock",".dart",".swift"}
          MEDIA = {".png",".jpg",".jpeg",".webp",".gif",".ico",".svg",".woff",".woff2",".ttf",".otf"}
          SKIP = {"node_modules",".git","dist","build","out",".next",".nuxt","coverage",".cache",
                  "Pods","__pycache__",".gradle",".idea",".vscode","venv",".venv","target",".turbo"}
          SKIP_FILES = {"package-lock.json","yarn.lock","pnpm-lock.yaml",".DS_Store"}
          try:
              shutil.rmtree(out, ignore_errors=True)
              with zipfile.ZipFile(src) as z:
                  infos = z.infolist()
                  open("deepx_meta/listing.txt","w").write("\n".join(f"{i.filename}\t{i.file_size}" for i in infos[:20000]))
                  total = count = skipped = 0
                  CAP = 95_000_000
                  for i in infos:
                      if i.is_dir():
                          continue
                      name = i.filename.replace("\\", "/")
                      if set(name.split("/")) & SKIP:
                          continue
                      if os.path.basename(name) in SKIP_FILES:
                          continue
                      ext = os.path.splitext(name)[1].lower()
                      if not (ext in CODE or ext in MEDIA):
                          continue
                      if i.file_size > (4_000_000 if ext in CODE else 700_000):
                          skipped += 1
                          continue
                      if total > CAP:
                          continue
                      try:
                          data = z.read(i)
                      except Exception:
                          continue
                      dest = os.path.join(out, name)
                      os.makedirs(os.path.dirname(dest) or out, exist_ok=True)
                      open(dest, "wb").write(data)
                      total += len(data); count += 1
                  json.dump({"files": count, "bytes": total, "zip_entries": len(infos), "skipped_large": skipped},
                            open("deepx_meta/summary.json", "w"), indent=2)
                  print("EXTRACTED", count, "files", total, "bytes of", len(infos), "entries")
          except Exception:
              print("EXTRACT_FAILED")
              traceback.print_exc()
          PY
          say "python_exit=$?"
          ls deepx_src >> $LOG 2>&1
          du -sh deepx_src >> $LOG 2>&1
          say "== done =="

      - name: Post the log to an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TITLE="DeepX extraction log $(date -u +%H:%M:%SZ)"
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file deepx_meta/status.txt \
            --label "" 2>&1 | head -5 || gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file deepx_meta/status.txt

      - name: Push extracted source
        if: always()
        run: |
          set +e
          git config user.name "saif-extractor"
          git config user.email "noreply@example.com"
          git checkout -B deepx-extracted >> deepx_meta/status.txt 2>&1
          git add -A deepx_src deepx_meta >> deepx_meta/status.txt 2>&1
          git commit -m "DeepX studio: filtered source + extraction status" >> deepx_meta/status.txt 2>&1
          git push --force origin deepx-extracted >> deepx_meta/status.txt 2>&1
          echo "push_exit=$?" >> deepx_meta/status.txt
