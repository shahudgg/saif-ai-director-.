name: Inspect uploaded source
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/inspect-antigem.yml"]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: branch
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          path: main-source
      - name: Save archive inventory to branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          z = zipfile.ZipFile('main-source/antigem-master (1).zip')
          names = z.infolist()
          output = ['Files: %d; expanded bytes: %d' % (len(names), sum(x.file_size for x in names))]
          output.extend('%9d %s' % (i.file_size, i.filename) for i in names)
          for i in names:
              if i.filename.count('/') <= 2 and i.filename.lower().endswith(('readme.md','settings.gradle.kts','build.gradle.kts')) and i.file_size < 100000:
                  output.extend(['\n=== '+i.filename+' ===', z.read(i).decode('utf8',errors='replace')])
          pathlib.Path('branch/antigem-inventory.txt').write_text('\n'.join(output))
          PY
          cd branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add antigem-inventory.txt
          git commit -m 'Inventory uploaded archive' && git push origin "HEAD:$BRANCH"
