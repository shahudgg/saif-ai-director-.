name: Inspect uploaded source
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/inspect-antigem.yml"]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: branch
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          path: main-source
      - name: Extract source safely to branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import zipfile, pathlib, stat
          z = zipfile.ZipFile('main-source/antigem-master (1).zip')
          dest = pathlib.Path('branch/vendor/antigem').resolve()
          for info in z.infolist():
              p = pathlib.PurePosixPath(info.filename)
              if not p.parts or p.parts[0] != 'antigem-master': raise ValueError(info.filename)
              parts = p.parts[1:]
              if not parts: continue
              if any(x in ('..', '.git') for x in parts) or stat.S_ISLNK(info.external_attr >> 16): raise ValueError(info.filename)
              out = dest.joinpath(*parts)
              if info.is_dir(): out.mkdir(parents=True, exist_ok=True); continue
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(z.read(info))
          PYCODE
          cd branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f vendor/antigem
          git commit -m 'Extract uploaded AntiGem source with license' && git push origin "HEAD:$BRANCH"
