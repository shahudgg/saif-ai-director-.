name: Embedded engine device smoke test
on:
  push:
    branches: ["arena/**"]
    paths:
      - '.github/workflows/engine-device-smoke.yml'
      - 'app/src/androidTest/java/com/example/EmbeddedEngineSmokeTest.kt'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/antigem/agy_ide_bridge/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build opt-in application and test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PembeddedEngine --no-daemon
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.example.EmbeddedEngineSmokeTest com.saifai.assistant.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/engine-test.txt
            grep -q 'OK (1 test)' /tmp/engine-test.txt
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-device-smoke-logs
          path: /tmp/engine-test.txt
          if-no-files-found: ignore
