name: Embedded engine device smoke test
on:
  push:
    branches: ["arena/**"]
    paths:
      - '.github/workflows/engine-device-smoke.yml'
      - '.github/scripts/engine-device-smoke.sh'
      - 'app/src/androidTest/java/com/example/EmbeddedEngineSmokeTest.kt'
      - 'engine-integration/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/antigem/agy_ide_bridge/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build opt-in application and test APKs
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest -PembeddedEngine --no-daemon --stacktrace 2>&1 | tee /tmp/engine-build.log
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/engine-device-smoke.sh
      - name: Report smoke test failure
        if: failure()
        run: |
          python3 -c 'from pathlib import Path; p=Path("/tmp/engine-test.txt"); d=Path("/tmp/engine-script.log"); b=Path("/tmp/engine-build.log"); t=p.read_text(errors="replace") if p.exists() else (d.read_text(errors="replace") if d.exists() else ("\n".join(x for x in b.read_text(errors="replace").splitlines() if any(k in x.lower() for k in ("exception", "error", "failed", "caused by")))[-9500:] if b.exists() else "No build or test output")); print("::error::"+t[-10000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-device-smoke-logs
          path: /tmp/engine-test.txt
          if-no-files-found: ignore
