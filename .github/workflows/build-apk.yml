name: Build Android APK

on:
  push:
    branches: [ main, "arena/**" ]
    # The catalog sync commits telegram_catalog/*; that alone does not need a new APK.
    paths-ignore:
      - 'telegram_catalog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Bakes your Telegram asset library into the APK (assets_catalog.json). Never fails the build.
    - name: Snapshot Telegram asset catalog
      continue-on-error: true
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python3 scripts/telegram_catalog.py

    - name: Build Debug APK
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      shell: bash
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

    # Keeps the compiler errors readable from outside the Actions log viewer:
    # they are published as annotations and pushed to the `ci-errors` branch.
    - name: Publish compile errors
      if: failure()
      shell: bash
      run: |
        mkdir -p ci-logs
        {
          echo "#### e:/w: LINES ####"
          grep -E "^(e:|w:) " /tmp/build.log || echo "(none)"
          echo
          echo "#### FAILED TASK / SUMMARY ####"
          grep -E "^> Task .*FAILED|^FAILURE:|Execution failed for task|What went wrong|^Caused by:|BUILD FAILED" /tmp/build.log || true
          echo
          echo "#### LAST 250 LINES ####"
          tail -250 /tmp/build.log
        } > ci-logs/compile-errors.txt || true

        python3 - <<'PYEOF' || true
        import os
        p = "ci-logs/compile-errors.txt"
        if not os.path.exists(p):
            raise SystemExit(0)
        text = open(p, encoding="utf-8", errors="replace").read()
        n, size = 10, max(1, (len(text) + 9) // 10)
        for i in range(n):
            chunk = text[i * size:(i + 1) * size]
            if not chunk:
                continue
            esc = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            print("::error::PART %d/%d %s" % (i + 1, n, esc))
        PYEOF

        git config user.name  "ci-diagnostics"
        git config user.email "ci-diagnostics@users.noreply.github.com"
        git checkout -B ci-errors
        git add -f ci-logs/compile-errors.txt
        git commit -m "ci: compile errors $(date -u +%FT%TZ)" || echo "nothing to commit"
        git push -f origin ci-errors || echo "::warning::could not push ci-errors branch"

    # Unit tests run after the APK is built, so a failing test never hides the APK. Results are uploaded either way.
    - name: Run unit tests
      continue-on-error: true
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: gradle testDebugUnitTest --no-daemon

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # Round 11: also attach the APK to a rolling prerelease so it can be downloaded directly from
    # https://github.com/shahudgg/saif-ai-director-./releases (tag: saif-ai-apk) without opening Actions.
    - name: Publish APK to the saif-ai-apk release
      if: success()
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: saif-ai-apk
        name: "SAIF AI Director - debug APK (auto-build)"
        prerelease: true
        files: app/build/outputs/apk/debug/app-debug.apk
