name: Build Android APK

on:
  push:
    branches: [ main ]
    # The catalog sync commits telegram_catalog/*; that alone does not need a new APK.
    paths-ignore:
      - 'telegram_catalog/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Bakes your Telegram asset library into the APK (assets_catalog.json). Never fails the build.
    - name: Snapshot Telegram asset catalog
      continue-on-error: true
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python3 scripts/telegram_catalog.py

    - name: Build Debug APK
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: gradle assembleDebug --no-daemon

    # Unit tests run after the APK is built, so a failing test never hides the APK. Results are uploaded either way.
    - name: Run unit tests
      continue-on-error: true
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: gradle testDebugUnitTest --no-daemon

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
